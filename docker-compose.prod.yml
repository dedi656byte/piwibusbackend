services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${PIWIBUS_POSTGRES_PASSWORD:?PIWIBUS_POSTGRES_PASSWORD is required}

  backend:
    environment:
      PIWIBUS_ENV: production
      PIWIBUS_CORS_ORIGIN: ${PIWIBUS_CORS_ORIGIN:?PIWIBUS_CORS_ORIGIN is required}
      PIWIBUS_JWT_SECRET: ${PIWIBUS_JWT_SECRET:?PIWIBUS_JWT_SECRET is required}
      PIWIBUS_DATABASE_URL: postgres://piwibus:${PIWIBUS_POSTGRES_PASSWORD:?PIWIBUS_POSTGRES_PASSWORD is required}@postgres:5432/piwibus
      PIWIBUS_REDIS_URL: redis://redis:6379/0
      PIWIBUS_TRUST_PROXY_HEADERS: "true"
      PIWIBUS_ADMIN_EMAIL: ${PIWIBUS_ADMIN_EMAIL:?PIWIBUS_ADMIN_EMAIL is required}
      PIWIBUS_ADMIN_PASSWORD: ${PIWIBUS_ADMIN_PASSWORD:?PIWIBUS_ADMIN_PASSWORD is required}
      PIWIBUS_ADMIN_NAME: ${PIWIBUS_ADMIN_NAME:-Administrateur Piwibus}
      PIWIBUS_ADMIN_PHONE: ${PIWIBUS_ADMIN_PHONE:-}
      PIWIBUS_FIREBASE_PROJECT_ID: ${PIWIBUS_FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      PIWIBUS_PASSWORD_RESET_SHOW_CODE: "false"
      PIWIBUS_SMTP_HOST: ${PIWIBUS_SMTP_HOST:?PIWIBUS_SMTP_HOST is required}
      PIWIBUS_SMTP_PORT: ${PIWIBUS_SMTP_PORT:-587}
      PIWIBUS_SMTP_USERNAME: ${PIWIBUS_SMTP_USERNAME:?PIWIBUS_SMTP_USERNAME is required}
      PIWIBUS_SMTP_PASSWORD: ${PIWIBUS_SMTP_PASSWORD:?PIWIBUS_SMTP_PASSWORD is required}
      PIWIBUS_SMTP_SSL: ${PIWIBUS_SMTP_SSL:-false}
      PIWIBUS_SMTP_ALLOW_INSECURE: ${PIWIBUS_SMTP_ALLOW_INSECURE:-false}
      PIWIBUS_MAIL_FROM: ${PIWIBUS_MAIL_FROM:?PIWIBUS_MAIL_FROM is required}
      PIWIBUS_MAIL_FROM_NAME: ${PIWIBUS_MAIL_FROM_NAME:-Piwibus}

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER is required}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
